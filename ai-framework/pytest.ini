[pytest]
testpaths = tests
# Make `config` (project root) and `aiframe` (src/) importable in tests.
pythonpath = . src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    slow: tests that start apps or build UIs (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
