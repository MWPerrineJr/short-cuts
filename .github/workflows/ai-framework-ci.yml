# =============================================================================
# CI for ai-framework: lint + tests on every pull request and push to main.
#
# Tests use fake models, so no API keys or secrets are needed. CI is free to
# run and safe on any PR.
# =============================================================================
name: ai-framework CI

on:
  pull_request:
    paths:
      - "ai-framework/**"
      - "requirements.txt"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ai-framework-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai-framework/**"
      - "requirements.txt"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ai-framework-ci.yml"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-framework

env:
  PYTHONUNBUFFERED: "1"
  # Keep in sync with the ruff rev in .pre-commit-config.yaml.
  RUFF_VERSION: "0.16.9"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # show results for every Python version, not just the first failure
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ai-framework/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=src --cov=config --cov=apps
          --cov-report=term --cov-report=xml
          --junitxml=pytest-results.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            ai-framework/coverage.xml
            ai-framework/pytest-results.xml
          retention-days: 14
